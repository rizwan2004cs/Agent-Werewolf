# Render Blueprint — deploys the Pack stack (backend API + static frontend).
# In Render: New > Blueprint > point at this repo. Secrets (sync:false) are
# entered in the Render dashboard, never committed here.
#
# Caveats for the free plan:
#  - The Python web service sleeps after ~15 min idle and resets in-memory game
#    state on wake/restart (history.json is also ephemeral on free disk).
#  - For a live multi-audience demo, keep the backend warm or use a paid plan.
services:
  # ---- FastAPI backend: game loop + /state + /history + play-money betting ----
  - type: web
    name: pack-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      # Pick ONE provider (both use the OpenAI-compatible API), or set neither
      # to run in deterministic MOCK mode (offline, free).
      - key: OPENAI_API_KEY        # secret — set in dashboard, or leave unset
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: GROQ_API_KEY          # secret — Groq free tier (used if OPENAI_API_KEY is unset)
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: PACE
        value: "1.2"

  # ---- Vite/React frontend: served as a static site ----
  - type: web
    name: pack-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_BACKEND_URL      # set to the deployed pack-backend URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
