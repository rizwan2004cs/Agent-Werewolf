# Render Blueprint for Pack (deploying clean-main branch).
# Docs: https://render.com/docs/blueprint-spec
#
# Notes:
# - Both services are pinned to `clean-main`.
# - Keep secrets in Render Dashboard via `sync: false`.
# - On free plan, backend may sleep after idle periods.
services:
  # ---- FastAPI backend ----
  - type: web
    name: pack-backend
    runtime: python
    rootDir: backend
    branch: clean-main
    plan: free
    autoDeployTrigger: commit
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python -m uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: RPC_URL
        sync: false
      - key: CHAIN_ID
        value: "143"
      - key: CONTRACT_ADDRESS
        sync: false
      - key: OPERATOR_KEY
        sync: false
      - key: PACE
        value: "2.5"

  # ---- React frontend (static) ----
  - type: web
    name: pack-frontend
    runtime: static
    rootDir: frontend
    branch: clean-main
    plan: free
    autoDeployTrigger: commit
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      # Update if backend service URL differs on your Render account.
      - key: VITE_BACKEND_URL
        value: https://pack-backend.onrender.com
      - key: VITE_CONTRACT_ADDRESS
        sync: false
      - key: VITE_CHAIN_ID
        value: "143"
      - key: VITE_RPC_URL
        sync: false
      - key: VITE_EXPLORER_URL
        value: ""
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
